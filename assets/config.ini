; Aim trainer settings. Edit, save, press F5 in game to reload (window settings need a restart).
; Colours are "R, G, B" or "R, G, B, A" (0-255).

[window]
width = 1280
height = 720
fullscreen = false
vsync = false        ; false = lowest input lag
fps = 0              ; 0 = unlimited
msaa = 4             ; 0 to turn off
hfov = 100           ; horizontal field of view

[mouse]
sensitivity = 1.0    ; degrees per count = sensitivity * 0.022 (Source/CS style)
cm360 = 0            ; set > 0 to use cm per 360 turn instead (needs dpi)
dpi = 800

[weapon]
damage = 34
head_multiplier = 2.0
rpm = 600
auto = true          ; false = one shot per click
spread = 0.0         ; degrees of random cone

[bots]
count = 6
hp = 100
respawn = 0.4        ; seconds
height = 1.8
radius = 0.35
head_radius = 0.13
speed_min = 2.0      ; m/s, each bot re-rolls its speed whenever it picks a new destination
speed_max = 5.0
strafe_chance = 0.25
pause_chance = 0.15
retarget_min = 0.5   ; seconds before a bot picks a new random destination
retarget_max = 2.5
color = 200, 70, 70
model = models/bot.glb   ; optional: drop a .glb here, it is scaled to the bot height (hitboxes stay capsule-shaped)

[aura]
outline = true
outline_color = 80, 200, 255
outline_thickness = 0.03   ; meters
rim = true
rim_color = 80, 200, 255
rim_power = 2.5            ; higher = thinner rim
rim_intensity = 1.4
pulse_speed = 0.0          ; Hz, 0 = steady glow
rainbow = false
rainbow_speed = 0.25
through_walls = false      ; outline visible behind pillars
hit_color = 255, 255, 255  ; flash right after a hit

[tracer]
enabled = true
color = 255, 230, 120
width = 0.012
length = 4.0
speed = 220

[hitmarker]
enabled = true
color = 255, 255, 255
head_color = 255, 90, 60
kill_color = 255, 40, 40
size = 9
gap = 4
thickness = 2
duration = 0.18

[crosshair]
enabled = true
dot = true
color = 60, 255, 120
size = 7
gap = 4
thickness = 2

[world]
map = maps/arena.map
sky_top = 70, 120, 190
sky_bottom = 190, 215, 235
sky_image = sky/panorama.png   ; optional equirectangular picture, overrides the gradient
floor = 52, 56, 62
grid = 70, 76, 84
pillar = 90, 96, 108
wall = 36, 40, 46

[audio]
master = 0.6
shot = 0.35
hit = 0.8
headshot = 0.9
kill = 0.9
death = 0.7
; Put your own files in sounds/ named shot, hit, headshot, kill, death (.wav .ogg .mp3 .flac).
; Missing files fall back to built-in synthesized beeps.
