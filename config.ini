; Aim trainer settings. Edit, save, press F5 in game to reload (window settings need a restart).
; Colours are "R, G, B" or "R, G, B, A" (0-255).

[window]
width = 1280
height = 720
fullscreen = false
vsync = false        ; false = lowest input lag
fps = 0              ; 0 = unlimited
msaa = 4             ; 0 to turn off
hfov = 100           ; horizontal field of view

[mouse]
sensitivity = 1.0    ; degrees per count = sensitivity * 0.022 (Source/CS style)
cm360 = 0            ; set > 0 to use cm per 360 turn instead (needs dpi)
dpi = 800

; Weapons: press 1 / 2 in game. Hold RMB to aim down sights (ADS).
; ads_delay_ms = real input lag before the aim actually kicks in (and before it lets go). Try 150.
; pellets > 1 makes a shotgun: damage is per pellet, spread is the random cone in degrees.
[weapon1]
name = Carbine Mk2
damage = 34
head_multiplier = 2.0
rpm = 700
auto = true
spread = 0.25
pellets = 1
ads_fov = 50
ads_delay_ms = 150
ads_spread_mult = 0.3      ; spread multiplier at full ADS
ads_sens_mult = 0.65       ; mouse sensitivity multiplier at full ADS
tracer_color = 255, 230, 120

[weapon2]
name = Heavy Shotgun
damage = 18
head_multiplier = 1.5
rpm = 70
auto = false
spread = 4.0
pellets = 8
ads_fov = 65
ads_delay_ms = 220
ads_spread_mult = 0.6
ads_sens_mult = 0.8
tracer_color = 255, 160, 60

[movement]
; WASD movement and the A/D timing readout next to the crosshair.
; "A/D gap +34 ms" = time between letting go of one strafe key and pressing the other.
; Positive = dead time with no key held, negative = overlap (new key pressed before the old one was released).
enabled = true
show_gap = true
speed = 5.5            ; m/s
accel_ms = 60          ; time to reach full speed
decel_ms = 60          ; time to stop (counter-strafe)
move_spread = 3.0      ; extra spread in degrees at full speed, so shooting while moving is inaccurate
target_ms = 30         ; |gap| up to this is green, up to 2x yellow, above red
window_ms = 600        ; longer pauses between the two keys are not counted
; Timing resolution is one frame. For the finest readout set vsync = false and fps = 0 in [window].

[bots]
count = 6
hp = 100
respawn = 0.4        ; seconds
height = 1.8
radius = 0.35
head_radius = 0.13
speed_min = 2.0      ; m/s, each bot re-rolls its speed whenever it picks a new destination
speed_max = 5.0
strafe_chance = 0.25
pause_chance = 0.15
retarget_min = 0.5   ; seconds before a bot picks a new random destination
retarget_max = 2.5
hit_radius = 0.24      ; body hitbox radius (the character is about this wide, so shots match what you see)
color = 200, 70, 70    ; shirt
pants_color = 45, 50, 66
skin_color = 224, 186, 152
; Optional: drop your own character as models/bot.glb. It is scaled to the bot height and keeps its textures.
; Hitboxes stay capsule-shaped. If it walks sideways, set model_yaw to 90, 180 or 270.
model = models/bot.glb
model_yaw = 0

[aura]
outline = true
outline_color = 80, 200, 255
outline_thickness = 0.03   ; meters
rim = true
rim_color = 80, 200, 255
rim_power = 2.5            ; higher = thinner rim
rim_intensity = 1.4
pulse_speed = 0.0          ; Hz, 0 = steady glow
rainbow = false
rainbow_speed = 0.25
through_walls = false      ; outline visible behind pillars
hit_color = 255, 255, 255  ; flash right after a hit

[tracer]            ; colour comes from each weapon (tracer_color)
enabled = true
width = 0.012
length = 4.0
speed = 220

[hitmarker]
enabled = true
color = 255, 255, 255
head_color = 255, 90, 60
kill_color = 255, 40, 40
size = 9
gap = 4
thickness = 2
duration = 0.18

[crosshair]
enabled = true
dot = true
color = 60, 255, 120
size = 7
gap = 4
thickness = 2

[graphics]
; Scene lighting. The sky colours below (in [world]) drive the sky, the ambient light and the fog.
sun_dir = 0.45, 0.8, 0.35    ; direction TO the sun (x, y, z)
sun_color = 255, 240, 215
fog = 0.012                  ; fog density, 0 = off
shadows = true               ; soft blob shadows under bots and obstacles

[world]
map = maps/arena.map
sky_top = 70, 120, 190         ; top of the sky
sky_bottom = 190, 215, 235     ; horizon, also the fog colour
sky_image = sky/panorama.png   ; optional equirectangular picture, replaces the procedural sky
tile = 2.0                      ; floor tile size in meters
floor = 74, 80, 90
grid = 40, 44, 52
pillar = 120, 126, 140
wall = 52, 58, 68

[audio]
master = 0.6
shot = 0.35
hit = 0.8
headshot = 0.9
kill = 0.9
death = 0.7
; Put your own files in sounds/ named shot, hit, headshot, kill, death (.wav .ogg .mp3 .flac).
; Any length works; short clips (under ~1 second) feel best for rapid fire.
; Missing files fall back to built-in synthesized beeps.
